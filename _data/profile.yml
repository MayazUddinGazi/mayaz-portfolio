bio: >-
  I investigate sustainable cementitious systems across laboratory and computational scales.
  My work connects biochar, fly ash, seawater-mixed mortar, hydration chemistry, transport,
  and durability with machine learning models designed to remain physically meaningful
  beyond their training data.
focus: >-
  My goal is to turn experimental evidence into defensible tools for designing lower-carbon,
  durable concrete—not simply to optimize a statistical score.
