bio: >-
  I am a PhD candidate in Civil and Architectural Engineering at the University
  of Miami, working in the SMARIN Lab under Dr. Xianming Shi. My work sits
  Between the materials laboratory and the computer, I study how cementitious
  systems behave when conventional constituents are replaced by supplementary
  and alternative materials, and I build computational models that make that
  behavior predictable. Experimentally, I work across fresh properties,
  mechanical performance, durability, and microstructure, using TGA, XRD, XRF,
  SEM-EDS, isothermal calorimetry, electrical resistivity and impedance
  spectroscopy, shrinkage, and leaching methods under ASTM, AASHTO, and ACI
  protocols. Computationally, I work in physics-informed and physics-constrained
  machine learning, Bayesian optimization for mixture design, graph and deep
  neural networks, and computer vision for microstructural image analysis. I am
  most interested in problems where neither the chemistry nor the algorithm is
  Sufficient on its own.

focus: >-
  My focus is on connecting hydration chemistry and pore-structure evolution to
  engineering performance, and then encoding that understanding into models that
  hold up outside the dataset they were trained on. I am drawn to methods that
  carry physical meaning — constrained learning, uncertainty-aware prediction,
  and optimization that respects real mix-design limits — because a model that
  cannot explain itself cannot be specified. My goal is to turn experimental
  evidence into defensible tools for designing lower-carbon, durable concrete,
  not simply to optimize a statistical score.
